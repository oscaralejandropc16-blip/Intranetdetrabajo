<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Simulador del Botón USA - Román & Delgado</title>
    <style>
        body {
            /* Fondo simulando una web elegante de abogados */
            background: url('https://images.unsplash.com/photo-1505664194779-8beaceb93744?q=80&w=1500&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            height: 100vh;
            color: white;
        }
        .overlay {
            background: rgba(30, 30, 30, 0.85);
            height: 100%;
            width: 100%;
            padding: 50px;
            box-sizing: border-box;
        }
        h1 { font-size: 40px; margin-bottom: 10px; }
        p { font-size: 20px; color: #ccc; max-width: 600px;}
        
        /* CÓDIGO DEL BOTÓN EXACTO */
        .rd-international-btn {
            position: fixed;
            bottom: 30px;
            left: 30px;
            z-index: 99999;
            background-color: #117aca;
            color: white;
            padding: 10px 20px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            cursor: pointer;
            font-family: Arial, sans-serif;
            transition: transform 0.3s, background-color 0.3s;
        }
        .rd-international-btn:hover {
            background-color: #005eb8;
            transform: translateY(-4px);
        }
        .rd-international-btn img {
            height: 42px; /* Altura perfecta del logo */
            width: auto;
        }
        .rd-int-text {
            display: flex;
            flex-direction: column;
            text-align: left;
        }
        .rd-int-text strong {
            font-size: 15px;
            letter-spacing: 0.5px;
        }
        .rd-int-text span {
            font-size: 12px;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="overlay">
        <h1>ROMÁN & DELGADO</h1>
        <p>Este es un simulador de cómo se verá tu página web.</p>
        <p><strong>👉 Fíjate en la esquina inferior izquierda</strong> para ver el nuevo botón flotante en acción. ¡Pásale el ratón por encima y hazle clic!</p>
        
        <!-- EL BOTÓN -->
        <div class="rd-international-btn" onclick="alert('¡Excelente! Cuando un cliente de USA haga clic aquí en tu WordPress, la página automáticamente se traducirá al inglés usando el script oculto.')">
            <!-- Estamos usando el logo real que guardamos antes -->
            <img src="webapp/public/logo_chase_propuesta.png" alt="International Services">
            <div class="rd-int-text">
                <strong>US CLIENTS</strong>
                <span>International Services</span>
            </div>
        </div>
    </div>
</body>
</html>
